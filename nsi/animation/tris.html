<style>
  /* ── Onglets d'algorithmes ── */
  .tabs {
    position: fixed; top: calc(var(--topbar-h, 70px) + 26px); left: 50%; transform: translateX(-50%); z-index: 5;
    display: flex; gap: 4px; padding: 5px; border-radius: 14px;
  }
  .tab {
    appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit;
    font-weight: 700; font-size: 13.5px; padding: 0 16px; height: 36px; border-radius: 10px; cursor: pointer;
    transition: .2s; white-space: nowrap; position: relative;
  }
  .tab:hover { color: var(--text); background: rgba(255,255,255,.06); }
  .tab.on { color: #fff; background: var(--grad-main); box-shadow: 0 6px 18px rgba(108,158,255,.35); }
  .tab.race.on { background: var(--grad-warm); color: #1a1020; box-shadow: 0 6px 18px rgba(255,79,163,.35); }
  .tab .cx { font-size: 10px; opacity: .75; margin-left: 6px; font-family: 'JetBrains Mono', monospace; font-weight: 600; }

  /* ── Zone principale ── */
  #stage {
    position: fixed; left: 16px; right: 16px; top: calc(var(--topbar-h, 70px) + 82px); bottom: calc(var(--toolbar-h, 62px) + 30px); z-index: 2;
    display: grid; grid-template-columns: 1fr 360px; gap: 14px;
  }
  #stage.race { grid-template-columns: 1fr 300px; }
  #vizPanel { position: relative; overflow: hidden; }
  #viz { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #vizPanel.hidden { display: none; }

  #raceGrid { display: none; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; }
  #stage.race #raceGrid { display: grid; }
  .lane { position: relative; overflow: hidden; }
  .lane canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .lane .lname {
    position: absolute; top: 10px; left: 12px; z-index: 2; font-weight: 800; font-size: 13px; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 8px;
  }
  .lane .lname .cx { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); font-weight: 600; }
  .lane .rank {
    position: absolute; top: 8px; right: 10px; z-index: 2; font-weight: 800; font-size: 13px; padding: 4px 10px;
    border-radius: 999px; background: var(--grad-win); color: #06201c; opacity: 0; transform: scale(.6); transition: .35s cubic-bezier(.2,1.6,.4,1);
  }
  .lane .rank.show { opacity: 1; transform: scale(1); }
  .lane .lstats { position: absolute; bottom: 8px; left: 12px; z-index: 2; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lane .lstats b { color: var(--text); }

  /* ── Panneau latéral ── */
  #side { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; padding-right: 2px; }
  #stage.race .single-only { display: none; }
  #raceCard { display: none; }
  #stage.race #raceCard { display: block; }
  .rrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--border); margin-bottom: 8px; }
  .rrow .nm { font-weight: 700; font-size: 13px; }
  .rrow .cx { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); }
  .rrow .st { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rrow .st b { color: var(--text); }
  .rrow .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
  .rrow .bar i { display: block; height: 100%; width: 0; background: var(--grad-win); transition: width .2s; }

  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 14px; border-radius: 3px; display: inline-block; }

  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--grad-main); border: 2px solid #fff; box-shadow: 0 2px 10px rgba(108,158,255,.6); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--grad-main); border: 2px solid #fff; cursor: pointer; }
  #bSound.on { color: var(--amber); border-color: rgba(255,197,61,.4); }

  @media (max-width: 1000px) {
    #stage { grid-template-columns: 1fr; }
    #stage.race { grid-template-columns: 1fr; }
    #side { display: none; }
    .tab { padding: 0 10px; font-size: 12px; height: 32px; }
    .tab .cx { display: none; }
    #raceGrid { gap: 8px; }
  }
</style>

<!-- ============ Algorithmes (générateurs d'étapes) ============ -->
<script id="logic">
// Chaque algorithme est un générateur qui trie `a` SUR PLACE et produit des étapes :
//  {t:'cmp', i, j, line}  comparaison de a[i] et a[j]         (indices du tableau principal)
//  {t:'swap', i, j, line} échange                              (compteur "échanges")
//  {t:'set', i, v, line}  écriture a[i] = v                    (compteur "écritures")
//  {t:'key', i, line}     élément en main (insertion), i = -1 pour effacer
//  {t:'min', i, line}     minimum courant (sélection)
//  {t:'sorted', i}        a[i] est définitivement à sa place
//  {t:'range', lo, mid, hi, line}  sous-tableau en cours (fusion)
//  {t:'aux', lo, vals, i, j, line} tampon de fusion (vals = copie), i/j = pointeurs ; vals = null pour effacer
//  {t:'acmp', i, j, line} comparaison dans le tampon
//  {t:'line', line}       simple mise en évidence d'une ligne de code

function* selectionSort(a) {
  const n = a.length;
  yield { t: 'line', line: 2 };
  for (let i = 0; i < n - 1; i++) {
    let imin = i;
    yield { t: 'min', i: imin, line: 4 };
    for (let j = i + 1; j < n; j++) {
      yield { t: 'cmp', i: j, j: imin, line: 6 };
      if (a[j] < a[imin]) { imin = j; yield { t: 'min', i: imin, line: 7 }; }
    }
    if (imin !== i) { [a[i], a[imin]] = [a[imin], a[i]]; yield { t: 'swap', i, j: imin, line: 8 }; }
    else yield { t: 'line', line: 8 };
    yield { t: 'sorted', i };
  }
  yield { t: 'sorted', i: n - 1 };
}

function* insertionSort(a) {
  const n = a.length;
  yield { t: 'sorted', i: 0, soft: true };
  for (let i = 1; i < n; i++) {
    const key = a[i];
    yield { t: 'key', i, line: 3 };
    let j = i - 1;
    yield { t: 'line', line: 4 };
    while (j >= 0) {
      yield { t: 'cmp', i: j, j: i, key: true, line: 5 };
      if (a[j] <= key) break;
      a[j + 1] = a[j];
      yield { t: 'set', i: j + 1, v: a[j], key: true, line: 6 };
      j--;
      yield { t: 'line', line: 7 };
    }
    a[j + 1] = key;
    yield { t: 'set', i: j + 1, v: key, line: 8 };
    yield { t: 'key', i: -1 };
    yield { t: 'sorted', i, soft: true };
  }
  for (let i = 0; i < n; i++) yield { t: 'sorted', i };
}

function* bubbleSort(a) {
  const n = a.length;
  yield { t: 'line', line: 2 };
  for (let i = 0; i < n - 1; i++) {
    for (let j = 0; j < n - 1 - i; j++) {
      yield { t: 'cmp', i: j, j: j + 1, line: 5 };
      if (a[j] > a[j + 1]) { [a[j], a[j + 1]] = [a[j + 1], a[j]]; yield { t: 'swap', i: j, j: j + 1, line: 6 }; }
    }
    yield { t: 'sorted', i: n - 1 - i };
  }
  yield { t: 'sorted', i: 0 };
}

function* mergeSort(a, lo = 0, hi = a.length - 1) {
  if (lo >= hi) { yield { t: 'range', lo, mid: lo, hi, line: 3 }; return; }
  const mid = (lo + hi) >> 1;
  yield { t: 'range', lo, mid, hi, line: 4 };
  yield { t: 'line', line: 5 };
  yield* mergeSort(a, lo, mid);
  yield { t: 'range', lo, mid, hi, line: 6 };
  yield* mergeSort(a, mid + 1, hi);
  yield { t: 'range', lo, mid, hi, line: 7 };
  // fusion
  const vals = a.slice(lo, hi + 1), nL = mid - lo + 1;
  let i = 0, j = nL, k = lo;
  yield { t: 'aux', lo, vals, i, j, line: 10 };
  while (i < nL && j < vals.length) {
    yield { t: 'acmp', i, j, line: 13 };
    if (vals[i] <= vals[j]) { a[k] = vals[i]; yield { t: 'set', i: k, v: vals[i], ai: i, line: 14 }; i++; }
    else { a[k] = vals[j]; yield { t: 'set', i: k, v: vals[j], ai: j, line: 16 }; j++; }
    k++;
    yield { t: 'aux', lo, vals, i, j };
  }
  while (i < nL) { a[k] = vals[i]; yield { t: 'set', i: k, v: vals[i], ai: i, line: 17 }; i++; k++; yield { t: 'aux', lo, vals, i, j }; }
  while (j < vals.length) { a[k] = vals[j]; yield { t: 'set', i: k, v: vals[j], ai: j, line: 17 }; j++; k++; yield { t: 'aux', lo, vals, i, j }; }
  yield { t: 'aux', lo, vals: null };
  if (lo === 0 && hi === a.length - 1) for (let x = 0; x < a.length; x++) yield { t: 'sorted', i: x };
}

const ALGOS = {
  selection: { gen: selectionSort, cx: 'O(n²)', stable: false, inplace: true, writes: 'swap' },
  insertion: { gen: insertionSort, cx: 'O(n²)', stable: true, inplace: true, writes: 'set' },
  bulles:    { gen: bubbleSort,    cx: 'O(n²)', stable: true, inplace: true, writes: 'swap' },
  fusion:    { gen: mergeSort,     cx: 'O(n log n)', stable: true, inplace: false, writes: 'set' },
};
if (typeof module !== 'undefined') module.exports = { selectionSort, insertionSort, bubbleSort, mergeSort, ALGOS };
</script>

// ─────────────────────── Textes ───────────────────────
const T = {
  fr: {
    lang: 'EN', title: 'Visualisation de tris', info: 'Info', close: 'Fermer',
    hint: 'Chaque barre est un nombre. Choisissez un algorithme, lancez-le ou avancez pas à pas, et observez les comparaisons, les échanges et le code Python qui s’exécute.',

    stats: 'Compteurs', cmp: 'comparaisons', swaps: 'échanges', writes: 'écritures', codeTitle: 'Python',
    stable: 'stable', unstable: 'non stable', inplace: 'en place', notinplace: 'mémoire auxiliaire',
    legend: { def: 'non trié', cmp: 'comparé', wr: 'échangé / écrit', key: 'en main', min: 'minimum courant', sorted: 'à sa place', aux: 'tampon de fusion' },
    done: (name, c, w, wl) => `${name} terminé : ${c} comparaisons, ${w} ${wl}`,
    raceDone: order => 'Classement : ' + order.join(' › '),
    rank: ['1er', '2e', '3e', '4e'],
    names: { selection: 'Tri par sélection', insertion: 'Tri par insertion', bulles: 'Tri à bulles', fusion: 'Tri fusion', course: 'Course' },
    desc: {
      selection: 'À chaque tour, on cherche le plus petit élément de la partie non triée et on l’échange avec le premier élément de cette partie. Peu d’échanges (n − 1 au maximum) mais toujours n(n − 1)/2 comparaisons, même si le tableau est déjà trié.',
      insertion: 'On prend les éléments un par un et on insère chacun à sa place dans la partie déjà triée, en décalant les plus grands vers la droite. Très rapide sur un tableau presque trié (O(n) dans le meilleur cas).',
      bulles: 'On parcourt le tableau en échangeant chaque paire de voisins mal ordonnés : le plus grand « remonte » comme une bulle jusqu’au bout. Simple à écrire, mais c’est le plus lent : beaucoup d’échanges.',
      fusion: 'Diviser pour régner : on coupe le tableau en deux, on trie chaque moitié (récursivement), puis on fusionne les deux moitiés triées en un seul tableau trié. Toujours en O(n log n), au prix d’un tableau auxiliaire.',
    },
    code: {
      selection: [
        'def tri_selection(t):',
        '    n = len(t)',
        '    for i in range(n - 1):',
        '        imin = i',
        '        for j in range(i + 1, n):',
        '            if t[j] < t[imin]:',
        '                imin = j',
        '        t[i], t[imin] = t[imin], t[i]'],
      insertion: [
        'def tri_insertion(t):',
        '    for i in range(1, len(t)):',
        '        cle = t[i]',
        '        j = i - 1',
        '        while j >= 0 and t[j] > cle:',
        '            t[j + 1] = t[j]',
        '            j = j - 1',
        '        t[j + 1] = cle'],
      bulles: [
        'def tri_bulles(t):',
        '    n = len(t)',
        '    for i in range(n - 1):',
        '        for j in range(n - 1 - i):',

        'def tri_fusion(t):',

        '    m = len(t) // 2',
        '    g = tri_fusion(t[:m])',
        '    d = tri_fusion(t[m:])',
        '    return fusion(g, d)',

        'def fusion(g, d):',
        '    r = []',
        '    i, j = 0, 0',

    infoHTML: `
<h2>Visualiser les algorithmes de tri</h2>
<p>Le tableau contient les nombres de 1 à n, mélangés. La hauteur de chaque barre est sa valeur. Chaque algorithme est écrit comme un <b>générateur</b> qui trie le tableau et signale chaque comparaison et chaque écriture : c’est exactement ce que fait le code Python affiché, étape par étape.</p>
<h3>Ce qu’il faut observer</h3>
<p><b>Comparaisons</b> : combien de fois on regarde deux valeurs. <b>Échanges / écritures</b> : combien de fois on modifie le tableau. Pour n = 30, un tri quadratique fait environ 435 comparaisons ; le tri fusion en fait environ 110. Doublez n avec le curseur : les tris en O(n²) prennent quatre fois plus de temps, le tri fusion à peine plus du double.</p>
<h3>Stabilité, en place</h3>
<p>Un tri est <b>stable</b> s’il conserve l’ordre relatif des éléments égaux (important quand on trie des fiches sur une clé). Il est <b>en place</b> s’il n’a besoin que d’une mémoire supplémentaire constante : le tri fusion, lui, copie les sous-tableaux dans un tampon.</p>
<h3>Le mode Course</h3>
<p>Les quatre algorithmes partent du même mélange et avancent au même rythme (une étape chacun par tic). Le premier à finir gagne. Essayez avec un tableau presque trié (mélangez, puis relancez plusieurs fois) et observez qui profite le plus de l’ordre déjà présent.</p>
<h3>Raccourcis</h3>
<p><span class="kbd">Espace</span> lancer / pause · <span class="kbd">→</span> une étape · <span class="kbd">R</span> mélanger · <span class="kbd">1</span>–<span class="kbd">5</span> changer d’onglet</p>`

    shuffle: 'Shuffle', play: '▶ Run', pause: '⏸ Pause', replay: '↺ Replay', n: 'n', speed: 'speed',
    stats: 'Counters', cmp: 'comparisons', swaps: 'swaps', writes: 'writes', codeTitle: 'Python',
    stable: 'stable', unstable: 'not stable', inplace: 'in place', notinplace: 'extra memory',
    legend: { def: 'unsorted', cmp: 'compared', wr: 'swapped / written', key: 'in hand', min: 'current minimum', sorted: 'in place', aux: 'merge buffer' },
    done: (name, c, w, wl) => `${name} done: ${c} comparisons, ${w} ${wl}`,
    raceDone: order => 'Ranking: ' + order.join(' › '),
    rank: ['1st', '2nd', '3rd', '4th'],
    names: { selection: 'Selection sort', insertion: 'Insertion sort', bulles: 'Bubble sort', fusion: 'Merge sort', course: 'Race' },
    desc: {
      selection: 'On each pass, find the smallest element of the unsorted part and swap it with the first element of that part. Few swaps (at most n − 1) but always n(n − 1)/2 comparisons, even on a sorted array.',
      insertion: 'Take the elements one by one and insert each into its place in the already-sorted part, shifting larger ones to the right. Very fast on a nearly sorted array (O(n) in the best case).',
      bulles: 'Scan the array swapping every pair of neighbours in the wrong order: the largest “bubbles up” to the end. Easy to write, but the slowest: lots of swaps.',
      fusion: 'Divide and conquer: split the array in two, sort each half (recursively), then merge the two sorted halves into one sorted array. Always O(n log n), at the cost of an auxiliary array.',
    },
    code: {
      selection: [
        'def selection_sort(t):',
        '    n = len(t)',
        '    for i in range(n - 1):',
        '        imin = i',
        '        for j in range(i + 1, n):',
        '            if t[j] < t[imin]:',
        '                imin = j',
        '        t[i], t[imin] = t[imin], t[i]'],
      insertion: [
        'def insertion_sort(t):',
        '    for i in range(1, len(t)):',
        '        key = t[i]',
        '        j = i - 1',
        '        while j >= 0 and t[j] > key:',
        '            t[j + 1] = t[j]',
        '            j = j - 1',
        '        t[j + 1] = key'],
      bulles: [
        'def bubble_sort(t):',
        '    n = len(t)',
        '    for i in range(n - 1):',
        '        for j in range(n - 1 - i):',
        '            if t[j] > t[j + 1]:',
        '                t[j], t[j + 1] = t[j + 1], t[j]'],
      fusion: [
        'def merge_sort(t):',
        '    if len(t) <= 1:',
        '        return t',
        '    m = len(t) // 2',
        '    l = merge_sort(t[:m])',
        '    r = merge_sort(t[m:])',
        '    return merge(l, r)',
        '',
        'def merge(l, r):',
        '    out = []',
        '    i, j = 0, 0',
        '    while i < len(l) and j < len(r):',
        '        if l[i] <= r[j]:',
        '            out.append(l[i]); i += 1',
        '        else:',
        '            out.append(r[j]); j += 1',
        '    return out + l[i:] + r[j:]'],
    },
    infoHTML: `
<h2>Visualizing sorting algorithms</h2>
<p>The array holds the numbers 1 to n, shuffled. The height of each bar is its value. Each algorithm is written as a <b>generator</b> that sorts the array and reports every comparison and every write: exactly what the displayed Python code does, step by step.</p>
<h3>What to look at</h3>
<p><b>Comparisons</b>: how many times two values are looked at. <b>Swaps / writes</b>: how many times the array is modified. For n = 30, a quadratic sort makes about 435 comparisons; merge sort about 110. Double n with the slider: O(n²) sorts take four times longer, merge sort barely more than twice.</p>
<h3>Stable, in place</h3>
<p>A sort is <b>stable</b> if it keeps the relative order of equal elements (important when sorting records by a key). It is <b>in place</b> if it needs only a constant amount of extra memory: merge sort copies sub-arrays into a buffer.</p>
<h3>Race mode</h3>
<p>The four algorithms start from the same shuffle and advance at the same pace (one step each per tick). First to finish wins. Try a nearly sorted array (shuffle, then replay several times) and see who benefits most from existing order.</p>
<h3>Shortcuts</h3>
<p><span class="kbd">Space</span> run / pause · <span class="kbd">→</span> one step · <span class="kbd">R</span> shuffle · <span class="kbd">1</span>–<span class="kbd">5</span> switch tab</p>`
  }
};

const COL = {
  def: ['#4f6fe8', '#8fb0ff'], cmp: ['#ffb020', '#ffd76a'], wr: ['#ff2d8f', '#ff8ac4'],
  key: ['#9b5cff', '#cfa8ff'], min: ['#ffb020', '#ffd76a'], sorted: ['#19c9a8', '#7df5df'], aux: ['#5b6480', '#9aa3c0'],
};

// ─────────────────────── Modèle d'une visualisation ───────────────────────
function shuffled(n) {
  const a = Array.from({ length: n }, (_, i) => i + 1);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

class Sorter {
  constructor(algo, canvas) {
    this.algo = algo; this.canvas = canvas; this.ctx = canvas.getContext('2d');
    this.reset(shuffled(30));
  }
  reset(base) {
    this.base = base.slice(); this.a = base.slice(); this.n = base.length;
    this.gen = ALGOS[this.algo].gen(this.a);
    this.cmp = 0; this.wr = 0; this.done = false; this.line = 0; this.steps = 0;
    this.mark = { cmp: [-1, -1], wr: -1, key: -1, min: -1, range: null, aux: null, acmp: [-1, -1] };
    this.sorted = new Set(); this.soft = new Set();
    this.flash = 0;
  }
  step() {
    if (this.done) return false;
    const r = this.gen.next();
    if (r.done) { this.done = true; this.finishAll(); return false; }
    const s = r.value, m = this.mark;
    m.cmp = [-1, -1]; m.wr = -1; m.acmp = [-1, -1];
    if (s.line) this.line = s.line;
    this.lastOp = (s.t === 'cmp' || s.t === 'acmp' || s.t === 'swap' || s.t === 'set');
    switch (s.t) {
      case 'cmp': this.cmp++; m.cmp = [s.i, s.j]; beep(this.a[s.i], this.n); break;
      case 'swap': this.wr++; m.cmp = [s.i, s.j]; m.wr = s.i; this.flash = 1; break;
      case 'set': this.wr++; m.wr = s.i; if (s.ai != null && m.aux) m.aux.hi = s.ai; beep(s.v, this.n); break;
      case 'key': m.key = s.i; break;
      case 'min': m.min = s.i; break;
      case 'sorted': if (s.soft) this.soft.add(s.i); else { this.sorted.add(s.i); this.soft.delete(s.i); } break;
      case 'range': m.range = { lo: s.lo, mid: s.mid, hi: s.hi }; break;
      case 'aux': m.aux = s.vals ? { lo: s.lo, vals: s.vals, i: s.i, j: s.j } : null; break;
      case 'acmp': m.acmp = [s.i, s.j]; this.cmp++; beep(m.aux ? m.aux.vals[s.i] : 1, this.n); break;
    }
    this.steps++;
    return true;
  }
  finishAll() {
    const m = this.mark; m.cmp = [-1, -1]; m.wr = -1; m.key = -1; m.min = -1; m.aux = null; m.range = null; m.acmp = [-1, -1];
    for (let i = 0; i < this.n; i++) this.sorted.add(i);
    this.line = 0;
  }
  // Avance jusqu'à la prochaine opération élémentaire (comparaison ou écriture) :
  // en mode course, chaque algorithme paie le même prix par tic, quelle que soit sa « paperasse ».
  stepOp() {
    while (this.step()) { if (this.lastOp) return true; }
    return false;
  }
  runToEnd() { while (this.step()); }
}

// ─────────────────────── Rendu ───────────────────────
function grad(ctx, y0, y1, pair) {
  const g = ctx.createLinearGradient(0, y1, 0, y0); g.addColorStop(0, pair[0]); g.addColorStop(1, pair[1]); return g;
}
function colorFor(S, i) {
  const m = S.mark;
  if (m.wr === i) return COL.wr;
  if (m.cmp[0] === i || m.cmp[1] === i) return COL.cmp;
  if (m.key === i) return COL.key;
  if (m.min === i) return COL.min;
  if (S.sorted.has(i)) return COL.sorted;
  if (S.soft.has(i)) return ['#3f8fd6', '#7fd0ff'];
  return COL.def;
}
function render(S, compact) {
  const cv = S.canvas, ctx = S.ctx, dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const n = S.n, m = S.mark, hasAux = !!m.aux;
  const padX = compact ? 10 : 22, padTop = compact ? 34 : 26, padBot = compact ? 26 : 22;
  const auxH = hasAux ? Math.min(H * 0.32, 180) : 0;
  const showNumPre = !compact && ((W - 2 * padX) / n) >= 24;
  const auxGap = showNumPre ? 44 : 28;
  const mainBottom = H - padBot - (hasAux ? auxH + auxGap : 0);
  const mainTop = padTop;
  const availW = W - 2 * padX;
  const gap = n > 80 ? 1 : n > 40 ? 2 : 3;
  const bw = (availW - gap * (n - 1)) / n;
  const maxH = mainBottom - mainTop;
  const showNum = !compact && bw >= 22;
  const r = Math.min(4, bw / 2);

  // fond de la plage active (fusion)
  if (m.range && !S.done) {
    const x0 = padX + m.range.lo * (bw + gap), x1 = padX + m.range.hi * (bw + gap) + bw;
    ctx.fillStyle = 'rgba(108,158,255,0.07)';
    roundRect(ctx, x0 - 3, mainTop - 8, x1 - x0 + 6, maxH + 12, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(108,158,255,0.35)'; ctx.lineWidth = 1; ctx.stroke();
    if (m.range.mid < m.range.hi) {
      const xm = padX + (m.range.mid + 1) * (bw + gap) - gap / 2;
      ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(xm, mainTop - 8); ctx.lineTo(xm, mainTop + maxH + 4); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  for (let i = 0; i < n; i++) {
    const v = S.a[i], h = Math.max(2, (v / n) * maxH);
    const x = padX + i * (bw + gap), y = mainBottom - h;
    const pair = colorFor(S, i);
    const hot = pair === COL.cmp || pair === COL.wr || pair === COL.key;
    if (hot) { ctx.shadowColor = pair[0]; ctx.shadowBlur = 18; }
    ctx.fillStyle = grad(ctx, y, mainBottom, pair);
    roundRect(ctx, x, y, bw, h, r); ctx.fill();
    ctx.shadowBlur = 0;
    if (showNum) {
      ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.font = `600 ${Math.min(12, bw * 0.5)}px Inter, sans-serif`; ctx.textAlign = 'center';
      ctx.fillText(v, x + bw / 2, mainBottom + 14);
    }
  }
  // indicateur "en main" (insertion) au-dessus de la barre clé
  if (m.key >= 0 && !S.done) {
    const x = padX + m.key * (bw + gap) + bw / 2;
    ctx.fillStyle = COL.key[1]; ctx.beginPath(); ctx.moveTo(x, mainTop - 2); ctx.lineTo(x - 6, mainTop - 12); ctx.lineTo(x + 6, mainTop - 12); ctx.fill();
  }
  if (m.min >= 0 && !S.done && S.algo === 'selection') {
    const x = padX + m.min * (bw + gap) + bw / 2;
    ctx.strokeStyle = COL.min[1]; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, mainBottom + (showNum ? 24 : 9), 4, 0, Math.PI * 2); ctx.stroke();
  }

  // tampon de fusion
  if (hasAux) {
    const A = m.aux, top = mainBottom + auxGap, bottom = H - padBot;
    const nA = A.vals.length, x0 = padX + A.lo * (bw + gap);
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    roundRect(ctx, x0 - 4, top - 6, nA * (bw + gap) - gap + 8, auxH + 10, 8); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '700 10px Inter, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(T[lang].legend.aux.toUpperCase(), x0, top - 10);
    const nL = m.range ? m.range.mid - m.range.lo + 1 : nA;
    for (let k = 0; k < nA; k++) {
      const consumed = (k < nL) ? k < A.i : k < A.j;
      const v = A.vals[k], h = Math.max(2, (v / n) * (auxH - 4));
      const x = x0 + k * (bw + gap), y = bottom - h;
      let pair = COL.aux;
      if (m.acmp[0] === k || m.acmp[1] === k) pair = COL.cmp;
      else if (A.hi === k && m.wr >= 0) pair = COL.wr;
      ctx.globalAlpha = consumed && pair === COL.aux ? 0.22 : 1;
      if (pair !== COL.aux) { ctx.shadowColor = pair[0]; ctx.shadowBlur = 14; }
      ctx.fillStyle = grad(ctx, y, bottom, pair);
      roundRect(ctx, x, y, bw, h, r); ctx.fill();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
    const xm = x0 + nL * (bw + gap) - gap / 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(xm, top); ctx.lineTo(xm, bottom); ctx.stroke(); ctx.setLineDash([]);
  }

  if (compact) {
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(0, H - 3, W * (S.sorted.size / n), 3);
  }
}
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

// ─────────────────────── Son ───────────────────────
let audio = null, soundOn = false, lastBeep = 0;
function beep(v, n) {
  if (!soundOn) return;
  const now = performance.now(); if (now - lastBeep < 18) return; lastBeep = now;
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'triangle'; o.frequency.value = 220 + (v / n) * 660;
  g.gain.setValueAtTime(0.0001, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.08, audio.currentTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.09);
  o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.1);
}

// ─────────────────────── Application ───────────────────────
const $ = id => document.getElementById(id);
const KEYS = ['selection', 'insertion', 'bulles', 'fusion', 'course'];
let lang = 'fr', tab = 'selection', playing = false, n = 30, speed = 55;
let base = shuffled(n);
let single = null;                 // Sorter courant (mode simple)
let lanes = [];                    // [{key, S, el, rankEl, statsEl}] (mode course)
let finishOrder = [];

function delayMs() { return 400 * Math.pow(1 - speed / 100, 2.2) + 2; }

function buildTabs() {
  const t = T[lang];
  $('tabs').innerHTML = KEYS.map(k => `<button class="tab${k === 'course' ? ' race' : ''}${k === tab ? ' on' : ''}" data-k="${k}">${t.names[k]}${ALGOS[k] ? `<span class="cx">${ALGOS[k].cx}</span>` : ' 🏁'}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => selectTab(b.dataset.k));
}
function selectTab(k) {
  if (!KEYS.includes(k)) return;
  tab = k; playing = false; schedule();
  history.replaceState(null, '', '#' + k);
  $('stage').classList.toggle('race', k === 'course');
  $('vizPanel').classList.toggle('hidden', k === 'course');
  buildTabs(); rebuild(); setUI();
}

function rebuild() {
  hideMsg(); finishOrder = [];
  if (tab === 'course') {
    $('raceGrid').innerHTML = '';
    lanes = KEYS.filter(k => k !== 'course').map(k => {
      const el = document.createElement('div'); el.className = 'lane glass';
      el.innerHTML = `<div class="lname"><span>${T[lang].names[k]}</span><span class="cx">${ALGOS[k].cx}</span></div><div class="rank"></div><canvas></canvas><div class="lstats"></div>`;
      $('raceGrid').appendChild(el);
      const S = new Sorter(k, el.querySelector('canvas')); S.reset(base);
      return { key: k, S, el, rankEl: el.querySelector('.rank'), statsEl: el.querySelector('.lstats') };
    });
    $('raceRows').innerHTML = '';
    lanes.forEach(L => {
      const row = document.createElement('div'); row.className = 'rrow';
      row.innerHTML = `<span class="nm">${T[lang].names[L.key]} <span class="cx">${ALGOS[L.key].cx}</span></span><span class="rk"></span><span class="st"></span><span class="bar"><i></i></span>`;
      $('raceRows').appendChild(row); L.row = row;
    });
  } else {
    single = new Sorter(tab, $('viz')); single.reset(base);
    lanes = [];
  }
  drawAll();
}

function drawAll() {
  if (tab === 'course') lanes.forEach(L => {
    render(L.S, true);
    const st = `<b>${L.S.cmp}</b> ${T[lang].cmp} · <b>${L.S.wr}</b> ${ALGOS[L.key].writes === 'swap' ? T[lang].swaps : T[lang].writes}`;
    L.statsEl.innerHTML = st;
    if (L.row) { L.row.querySelector('.st').innerHTML = st; L.row.querySelector('.bar i').style.width = (100 * L.S.sorted.size / L.S.n) + '%'; }
  });
  else { render(single, false); updateSide(); }
}

function tickOnce() {
  if (tab === 'course') {
    let any = false;
    lanes.forEach(L => {
      if (L.S.done) return;
      const ok = L.S.stepOp(); any = any || !L.S.done;
      if (!ok || L.S.done) {
        if (!finishOrder.includes(L.key)) {
          finishOrder.push(L.key);
          L.rankEl.textContent = T[lang].rank[finishOrder.length - 1]; L.rankEl.classList.add('show');
          if (L.row) { const rk = L.row.querySelector('.rk'); rk.textContent = L.rankEl.textContent; rk.classList.add('show'); }
        }
      }
    });
    if (!any) { playing = false; showMsg(T[lang].raceDone(finishOrder.map(k => T[lang].names[k])), 'win'); setUI(); }
    return any;
  }
  const ok = single.step();
  if (single.done) {
    playing = false;
    const wl = ALGOS[tab].writes === 'swap' ? T[lang].swaps : T[lang].writes;
    showMsg(T[lang].done(T[lang].names[tab], single.cmp, single.wr, wl), 'win');
    setUI();
  }
  return ok;
}

let timer = null;
function schedule() {
  clearTimeout(timer);
  if (!playing) return;
  const d = delayMs();
  const wait = Math.max(d, 16), k = Math.max(1, Math.round(wait / d));   // plusieurs étapes par tic si très rapide
  timer = setTimeout(() => { for (let i = 0; i < k && playing; i++) tickOnce(); schedule(); }, wait);
}
function loop() { requestAnimationFrame(loop); drawAll(); }

function updateSide() {
  const t = T[lang], S = single, A = ALGOS[tab];
  $('vCmp').textContent = S.cmp; $('vWr').textContent = S.wr;
  $('kWr').textContent = A.writes === 'swap' ? t.swaps : t.writes;
  const lines = $('code').children;
  for (let i = 0; i < lines.length; i++) lines[i].classList.toggle('hl', i + 1 === S.line && !S.done);
}

function highlight(src) {
  return src.replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/(#.*)$/, '<span class="cm">$1</span>')
    .replace(/\b(def|for|in|if|else|while|and|or|return|not)\b/g, '<span class="kw">$1</span>')
    .replace(/\b(range|len|append)\b/g, '<span class="fn">$1</span>')
    .replace(/\b(\d+)\b/g, '<span class="nb">$1</span>');
}

function setUI() {
  const t = T[lang];
  document.title = t.title; $('tTitle').textContent = t.title; $('tHint').textContent = t.hint;
  $('bLang').textContent = t.lang; $('bInfo').textContent = t.info; $('close').setAttribute('aria-label', t.close);
  $('bShuffle').textContent = t.shuffle; $('lblN').textContent = t.n; $('lblSpeed').textContent = t.speed;
  $('vN').textContent = n; $('vSpeed').textContent = speed;
  const finished = tab === 'course' ? lanes.every(L => L.S.done) : (single && single.done);
  $('bPlay').textContent = playing ? t.pause : finished ? t.replay : t.play;
  $('bPlay').className = 'btn ' + (playing ? '' : 'teal');
  $('bStep').disabled = playing || finished;
  $('hStats').textContent = t.stats; $('kCmp').textContent = t.cmp; $('hCode').textContent = t.codeTitle; $('hRace').textContent = t.names.course;
  $('infoContent').innerHTML = t.infoHTML;
  $('legend').innerHTML = [['def', COL.def], ['cmp', COL.cmp], ['wr', COL.wr], ['key', COL.key], ['sorted', COL.sorted], ['aux', COL.aux]]
    .map(([k, c]) => `<span><i style="background:linear-gradient(${c[1]},${c[0]})"></i>${t.legend[k]}</span>`).join('');
  if (tab !== 'course') {
    const A = ALGOS[tab];
    $('props').innerHTML = `<span class="prop">${A.cx}</span><span class="prop ${A.stable ? 'yes' : 'no'}">${A.stable ? t.stable : t.unstable}</span><span class="prop ${A.inplace ? 'yes' : 'no'}">${A.inplace ? t.inplace : t.notinplace}</span>`;
    $('code').innerHTML = t.code[tab].map(l => `<li>${highlight(l) || ' '}</li>`).join('');
    $('desc').textContent = t.desc[tab];
    updateSide();
  }
}

// ─────────────────────── Contrôles ───────────────────────
$('bShuffle').onclick = () => { base = shuffled(n); playing = false; schedule(); rebuild(); setUI(); };
$('rN').oninput = e => { n = +e.target.value; base = shuffled(n); playing = false; schedule(); rebuild(); setUI(); };
$('rSpeed').oninput = e => { speed = +e.target.value; setUI(); schedule(); };
$('bReset').onclick = () => { playing = false; schedule(); rebuild(); setUI(); };
$('bPlay').onclick = () => {
  const finished = tab === 'course' ? lanes.every(L => L.S.done) : single.done;
  if (finished) { rebuild(); }
  playing = !playing; hideMsg(); if (soundOn && audio) audio.resume(); setUI(); schedule();
};
$('bStep').onclick = () => { playing = false; schedule(); hideMsg(); tickOnce(); setUI(); };
$('bSound').onclick = () => { soundOn = !soundOn; $('bSound').textContent = soundOn ? '🔊' : '🔇'; $('bSound').classList.toggle('on', soundOn); if (soundOn && !audio) audio = new (window.AudioContext || window.webkitAudioContext)(); };
$('bLang').onclick = () => { lang = lang === 'fr' ? 'en' : 'fr'; document.documentElement.lang = lang; buildTabs(); if (tab === 'course') lanes.forEach(L => { L.el.querySelector('.lname span').textContent = T[lang].names[L.key]; if (L.row) L.row.querySelector('.nm').firstChild.textContent = T[lang].names[L.key] + ' '; }); setUI(); };
$('bInfo').onclick = () => { $('overlay').classList.add('open'); $('close').focus(); };
$('close').onclick = () => $('overlay').classList.remove('open');
$('overlay').onclick = ev => { if (ev.target.id === 'overlay') $('overlay').classList.remove('open'); };
window.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { $('overlay').classList.remove('open'); return; }
  if ($('overlay').classList.contains('open') || ev.target.tagName === 'INPUT') return;
  if (ev.key === ' ' || ev.code === 'Space') { ev.preventDefault(); $('bPlay').click(); }
  else if (ev.key === 'ArrowRight') { ev.preventDefault(); if (!$('bStep').disabled) $('bStep').click(); }
  else if (ev.key.toLowerCase() === 'r') $('bShuffle').click();
  else if (ev.key >= '1' && ev.key <= '5') selectTab(KEYS[+ev.key - 1]);
});

let msgTimer = null;
function showMsg(text, kind) {
  const m = $('msg'); m.textContent = text; m.className = 'toast glass show' + (kind ? ' ' + kind : '');
}
function hideMsg() { $('msg').classList.remove('show'); }

// ─────────────────────── Démarrage ───────────────────────
const h = location.hash.slice(1);
if (KEYS.includes(h)) tab = h;
$('stage').classList.toggle('race', tab === 'course');
$('vizPanel').classList.toggle('hidden', tab === 'course');
buildTabs(); rebuild(); setUI();
requestAnimationFrame(loop);
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (KEYS.includes(k) && k !== tab) selectTab(k); });
</script>
</body>
</html>
