<!-- ============ Logique pure ============ -->
<script id="logic">
// V : liste des identifiants de sommets ; adj(u) -> [{v, w}] ; start, target (ou null).
// Générateur d'étapes, sans tas : à chaque tour on choisit le sommet non fixé de plus petite distance,
// exactement comme quand on remplit le tableau à la main.
function* dijkstraSteps(V, adj, start, target) {
  const dist = {}, pred = {}, fixed = new Set();
  V.forEach(v => { dist[v] = Infinity; pred[v] = null; });
  dist[start] = 0;
  yield { t: 'init', line: 4 };
  while (fixed.size < V.length) {
    let u = null;
    for (const v of V) if (!fixed.has(v) && (u === null || dist[v] < dist[u])) u = v;
    if (u === null || dist[u] === Infinity) { yield { t: 'done', reached: false, unreachable: true, line: 13 }; return { dist, pred }; }
    yield { t: 'select', u, d: dist[u], line: 7 };
    fixed.add(u);
    yield { t: 'fix', u, d: dist[u], line: 8 };
    if (u === target) { yield { t: 'done', reached: true, line: 13 }; return { dist, pred }; }
    if (fixed.size === V.length) break;
    yield { t: 'newrow', u, line: 9 };
    for (const { v, w } of adj(u)) {
      if (fixed.has(v)) { yield { t: 'skip', u, v, w, line: 9 }; continue; }
      const cand = dist[u] + w, old = dist[v], improved = cand < old;
      if (improved) { dist[v] = cand; pred[v] = u; }
      yield { t: 'relax', u, v, w, old, cand, improved, oldPred: improved ? null : pred[v], line: improved ? 11 : 10 };
    }
    yield { t: 'copyrest', u, line: 9 };
  }
  yield { t: 'done', reached: target != null && fixed.has(target), line: 13 };
  return { dist, pred };
}
function pathTo(pred, start, target) {
  const p = []; let x = target;
  while (x != null) { p.unshift(x); if (x === start) return p; x = pred[x]; }
  return null;
}
if (typeof module !== 'undefined') module.exports = { dijkstraSteps, pathTo };
</script>

<h2>L’algorithme de Dijkstra</h2>
<p>Il calcule les plus courtes distances depuis un sommet de départ dans un graphe dont les arêtes ont des poids positifs. Idée : on fixe les sommets un par un, toujours le plus proche parmi ceux qui ne le sont pas encore, et on regarde si passer par lui raccourcit le chemin vers ses voisins.</p>
<h3>Le tableau « à la main »</h3>
<p>Une colonne par sommet. Première ligne : 0 pour le départ, ∞ ailleurs. À chaque ligne : on <b>entoure la plus petite valeur</b> parmi les sommets non fixés, le sommet est fixé et sa colonne est <b>barrée</b> pour la suite. On écrit ensuite une nouvelle ligne : pour chaque voisin non fixé, la nouvelle distance <i>distance du sommet fixé + poids</i> si elle est plus petite (avec le prédécesseur entre parenthèses), sinon on recopie l’ancienne. Les autres sommets sont recopiés tels quels.</p>
<p>À la fin, la distance d’un sommet est la valeur entourée dans sa colonne, et le plus court chemin se lit <b>en remontant les prédécesseurs</b> depuis l’arrivée.</p>
<h3>Le code Python</h3>
<p>La version affichée choisit le minimum avec <code>min</code> sur l’ensemble des sommets à visiter : c’est exactement le geste du tableau, en O(n²). Dans la pratique on utilise une file de priorité (module <code>heapq</code>) pour descendre à O((n + m) log n).</p>
<h3>Manipulations</h3>
<p>Déplacez les sommets à la souris. Mode <b>Départ</b> / <b>Arrivée</b> : cliquez sur un sommet. Mode <b>Éditer</b> : cliquez dans le vide pour ajouter un sommet, sur deux sommets pour créer ou modifier une arête, sur un poids pour le changer, double-cliquez un sommet pour le supprimer. Le bouton → rend le graphe orienté.</p>
<h3>Un peu d’histoire</h3>
<p>Edsger W. Dijkstra a conçu cet algorithme en 1956, en une vingtaine de minutes à la terrasse d’un café d’Amsterdam, pour montrer ce que pouvait faire l’ordinateur ARMAC. Il l’a publié en 1959. C’est le cœur des calculateurs d’itinéraires et du routage sur Internet (protocole OSPF).</p>

<p>It computes the shortest distances from a start vertex in a graph with positive edge weights. Idea: fix vertices one at a time, always the closest among those not yet fixed, and check whether going through it shortens the path to its neighbours.</p>
<h3>The table “by hand”</h3>
<p>One column per vertex. First row: 0 for the start, ∞ elsewhere. On each row: <b>circle the smallest value</b> among unfixed vertices; that vertex is fixed and its column is <b>crossed out</b> from then on. Then write a new row: for each unfixed neighbour, the new distance <i>fixed vertex’s distance + weight</i> if it is smaller (with the predecessor in brackets), otherwise copy the old one. Other vertices are copied unchanged.</p>
<p>At the end, a vertex’s distance is the circled value in its column, and the shortest path is read <b>by following predecessors backwards</b> from the target.</p>
<h3>The Python code</h3>
<p>The displayed version picks the minimum with <code>min</code> over the set of vertices to visit: exactly the table’s gesture, in O(n²). In practice a priority queue (<code>heapq</code>) brings it down to O((n + m) log n).</p>
<h3>Interactions</h3>
<p>Drag vertices with the mouse. <b>Start</b> / <b>Target</b> mode: click a vertex. <b>Edit</b> mode: click empty space to add a vertex, two vertices to create or change an edge, a weight to change it, double-click a vertex to delete it. The → button makes the graph directed.</p>
<h3>A bit of history</h3>
<p>Edsger W. Dijkstra designed the algorithm in 1956, in about twenty minutes at a café terrace in Amsterdam, to show off the ARMAC computer. He published it in 1959. It is the heart of route planners and of Internet routing (OSPF).</p>
<p><span class="kbd">Space</span> run / pause · <span class="kbd">→</span> one step · <span class="kbd">R</span> new random graph</p>`
  }
};

  p2: { V: [['A', .1, .3], ['B', .4, .12], ['C', .4, .6], ['D', .7, .3], ['E', .7, .85], ['F', .93, .6]],

let V = [];        // [{id, x, y}]  (x, y ∈ [0,1])
let E = [];        // [{a, b, w}]
let start = null, target = null, directed = false;

function loadPreset(k) {
  const p = PRESETS[k];

  E = p.E.map(([a, b, w]) => ({ a, b, w }));

function randomGraph() {
  const n = 6 + Math.floor(Math.random() * 4);
  V = [];
  // points bien espacés (rejet)
  for (let i = 0; i < n; i++) {
    let best = null, bd = -1;
    for (let t = 0; t < 40; t++) {
      const x = .08 + Math.random() * .84, y = .1 + Math.random() * .8;
      const d = Math.min(9, ...V.map(v => Math.hypot(v.x - x, (v.y - y) * .7)));
      if (d > bd) { bd = d; best = { x, y }; }
    }
    V.push({ id: String.fromCharCode(65 + i), ...best });
  }
  E = [];
  const has = (a, b) => E.some(e => (e.a === a && e.b === b) || (e.a === b && e.b === a));
  const add = (a, b) => { if (a !== b && !has(a, b)) E.push({ a, b, w: 1 + Math.floor(Math.random() * 9) }); };
  // arbre couvrant par plus proche voisin, puis 1 à 2 arêtes proches par sommet
  const inTree = [V[0].id];
  while (inTree.length < n) {
    let best = null, bd = 9;
    for (const v of V) if (!inTree.includes(v.id)) for (const u of inTree) {
      const uu = V.find(x => x.id === u), d = Math.hypot(uu.x - v.x, uu.y - v.y);
      if (d < bd) { bd = d; best = [u, v.id]; }
    }
    add(best[0], best[1]); inTree.push(best[1]);
  }
  for (const v of V) {
    const near = V.filter(u => u !== v).sort((p, q) => Math.hypot(p.x - v.x, p.y - v.y) - Math.hypot(q.x - v.x, q.y - v.y)).slice(0, 3);
    near.slice(0, 1 + Math.floor(Math.random() * 2)).forEach(u => { if (Math.random() < .7) add(v.id, u.id); });
  }

}
function adjOf(u) {

}
const vid = () => V.map(v => v.id);
const vert = id => V.find(v => v.id === id);

function fmt(d) { return d === Infinity ? '∞' : d; }

function step() {

// ─────────────────────── Tableau ───────────────────────
function renderTable() {
  const t = T[lang], ids = vid();
  let h = `<thead><tr><th class="step"></th>${ids.map(v => `<th class="v${v === start ? ' start' : ''}${v === target ? ' target' : ''}">${v}</th>`).join('')}<th class="pick">${t.pick}</th></tr></thead><tbody>`;
  S.rows.forEach((row, i) => {
    const last = i === S.rows.length - 1;
    h += `<tr${last ? ' class="cur"' : ''}><td class="step">${i === 0 ? '0' : row.src}</td>`;
    for (const v of ids) {
      const c = row.cells[v];
      if (!c) h += `<td class="empty"></td>`;
      else if (c.kind === 'fixedcol') h += `<td class="fixedcol"></td>`;
      else h += `<td class="${c.kind}${row.chosen === v ? ' chosen' : ''}${c.hot && last ? ' hot' : ''}">${cellHTML(c)}</td>`;
    }
    h += `<td class="pick">${row.chosen != null ? `${row.chosen} <span class="p">${fmt(row.chosenD)}</span>` : ''}</td></tr>`;
  });
  h += '</tbody>';
  $('tbl').innerHTML = h;
  const w = $('tableWrap'); w.scrollTop = w.scrollHeight;
  $('explain').innerHTML = S.explain;
  const lines = $('code').children;
  for (let i = 0; i < lines.length; i++) lines[i].classList.toggle('hl', i + 1 === S.line && S.started && !S.finished);
  $('hTableR').textContent = S.finished ? '✓' : '';
}

// ─────────────────────── Graphe (canvas) ───────────────────────
const cv = $('graph'), ctx = cv.getContext('2d');

// ─────────────────────── Lecture ───────────────────────
function delayMs() { return 1400 * Math.pow(1 - speed / 100, 1.8) + 80; }
function schedule() {

  timer = setTimeout(() => { step(); if (done) playing = false; setUI(); schedule(); }, delayMs());
}
(function loop() { requestAnimationFrame(loop); draw(); })();

// ─────────────────────── UI ───────────────────────
function highlight(src) {
  return src.replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/("[^"]*")/g, '<span class="st">$1</span>')
    .replace(/\b(def|for|in|if|else|while|and|or|return|not|lambda)\b/g, '<span class="kw">$1</span>')
    .replace(/\b(min|set|float)\b/g, '<span class="fn">$1</span>')
    .replace(/\b(\d+)\b/g, '<span class="nb">$1</span>');
}
function setUI() {
  const t = T[lang];
  document.title = t.title; $('tTitle').textContent = t.title; $('tHint').textContent = t.hint;
  $('bLang').textContent = t.lang; $('bInfo').textContent = t.info; $('close').setAttribute('aria-label', t.close);
  $('mStart').textContent = t.start; $('mTarget').textContent = t.target; $('mEdit').textContent = t.edit;
  document.querySelectorAll('.seg').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
  $('editHint').textContent = mode === 'edit' ? t.editHint : mode === 'target' ? t.dragHintT : t.dragHint;
  $('graphLegend').innerHTML = t.legend.map(([c, l]) => `<span><i style="background:${c}"></i>${l}</span>`).join('');
  $('bRandom').textContent = t.random; $('bDirected').title = t.directed; $('bDirected').classList.toggle('on', directed);
  $('lblSpeed').textContent = t.speed; $('vSpeed').textContent = speed;
  const sel = $('preset'); const cur = sel.value;
  sel.innerHTML = Object.keys(t.presets).map(k => `<option value="${k}">${t.presets[k]}</option>`).join('');
  sel.value = cur || 'p1';
  $('bPlay').textContent = playing ? t.pause : (done ? t.replay : t.play);
  $('bPlay').className = 'btn ' + (playing ? '' : 'teal');
  $('bPlay').disabled = !start; $('bStep').disabled = playing || done || !start;
  $('hTable').textContent = t.table; $('hExplain').textContent = t.explain; $('hCode').textContent = t.codeTitle;
  $('code').innerHTML = t.code.map(l => `<li>${highlight(l)}</li>`).join('');
  $('infoContent').innerHTML = t.infoHTML;
  renderTable();
}
document.querySelectorAll('.seg').forEach(b => b.onclick = () => { mode = b.dataset.m; pendingEdgeFrom = null; setUI(); });
$('preset').onchange = e => { loadPreset(e.target.value); $('preset').value = e.target.value; resetAlgo(); };
$('bRandom').onclick = () => { randomGraph(); $('preset').value = 'rnd'; resetAlgo(); };
$('bDirected').onclick = () => { directed = !directed; resetAlgo(); };
$('rSpeed').oninput = e => { speed = +e.target.value; setUI(); schedule(); };
$('bReset').onclick = () => resetAlgo();
$('bPlay').onclick = () => { if (!start) return; if (done) resetAlgo(); playing = !playing; hideMsg(); setUI(); schedule(); };
$('bStep').onclick = () => { playing = false; clearTimeout(timer); hideMsg(); step(); setUI(); };
$('bLang').onclick = () => { lang = lang === 'fr' ? 'en' : 'fr'; document.documentElement.lang = lang; if (!S.started) S.explain = start ? T[lang].ex.ready() : T[lang].ex.noStart(); setUI(); };
$('bInfo').onclick = () => { $('overlay').classList.add('open'); $('close').focus(); };
$('close').onclick = () => $('overlay').classList.remove('open');
$('overlay').onclick = ev => { if (ev.target.id === 'overlay') $('overlay').classList.remove('open'); };
window.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { $('overlay').classList.remove('open'); pendingEdgeFrom = null; return; }
  if ($('overlay').classList.contains('open') || ['INPUT', 'SELECT'].includes(ev.target.tagName)) return;
  if (ev.key === ' ' || ev.code === 'Space') { ev.preventDefault(); $('bPlay').click(); }
  else if (ev.key === 'ArrowRight') { ev.preventDefault(); if (!$('bStep').disabled) $('bStep').click(); }
  else if (ev.key.toLowerCase() === 'r') $('bRandom').click();
});
function showMsg(text, kind) { const m = $('msg'); m.textContent = text; m.className = 'toast glass show' + (kind ? ' ' + kind : ''); }
function hideMsg() { $('msg').classList.remove('show'); }

// ─────────────────────── Démarrage ───────────────────────
loadPreset('p1');
resetAlgo();
$('preset').value = 'p1';
</script>
</body>
